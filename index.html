<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frigorífico Rodrigues</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; }
  .btn { min-height: 56px; font-weight: 800; border-radius: 14px; padding: 12px 16px; font-size: 1.15rem; transition: transform .05s; }
  .btn:active { transform: scale(.97); }
  input, textarea, select { font-size: 1.25rem !important; }
  #print-area { display: none; }
  @media print {
    @page { margin: 0; size: 58mm auto; }
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; width: 58mm; padding: 2mm; color: #000; background: #fff;
      font-family: "Courier New", monospace; font-size: 11px; line-height: 1.25; }
    #print-area pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; }
    #print-area .g { font-size: 15px; font-weight: 900; }
    #print-area .c { text-align: center; }
    #print-area .box { border: 2px solid #000; padding: 4px; margin: 6px 0; text-align: center; font-weight: 900; font-size: 15px; }

  @keyframes pisca { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.9);} 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0);} }

</style>
</head>
<body class="bg-slate-100 text-slate-900">

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] hidden px-6 py-4 rounded-2xl text-white text-xl font-bold shadow-2xl"></div>
<div id="print-area"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO  —  preencha com os dados do seu projeto Supabase
   (Supabase > Project Settings > API)
   ============================================================ */
const SUPABASE_URL = 'https://ahpfjuqggtqumntrxvhd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocGZqdXFnZ3RxdW1udHJ4dmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMTM5NjAsImV4cCI6MjEwODg4OTk2MH0.VW4apHPRFvSygdEBBFxCLGXhK0j92n3hI22GreehEv8';  // chave pública (segura para o site)
const NOME_ACOUGUE = 'FRIGORÍFICO RODRIGUES';                   // aparece no extrato e no zap
const DIAS_PRAZO = 30;                                  // a cobrança vence X dias após a primeira compra em aberto

/* ============================================================ */
const configurado = !SUPABASE_URL.startsWith('COLE') && !SUPABASE_ANON_KEY.startsWith('COLE');
const db = configurado ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// ---------- Utilidades ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = (n) => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtData = (d) => new Date(d).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
const fmtHora = (d) => new Date(d).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function parseValor(v) {
  let s = String(v).trim().replace(/[^\d,.\-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? NaN : Math.round(n * 100) / 100;
}
function toast(msg, ok = true) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] px-6 py-4 rounded-2xl text-white text-xl font-bold shadow-2xl ${ok ? 'bg-green-600' : 'bg-red-600'}`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), 3500);
}
function telDigits(t) { return String(t || '').replace(/\D/g, ''); }
// Nome para exibir: família se tiver, senão o cliente (um dos dois é obrigatório)
const nomeF = (f) => f.nome_familia || f.cliente_principal || 'Sem nome';
const nomeCli = (f) => f.cliente_principal || f.nome_familia || '';
let ocupado = false;
async function seguro(fn) {            // impede clique duplo e mostra erros
  if (ocupado) return;
  ocupado = true;
  try { await fn(); } catch (e) { toast('Erro: ' + (e.message || e), false); }
  finally { ocupado = false; }
}
// O Supabase devolve no máximo 1000 linhas por busca: busca em páginas para nunca cortar dados
async function tudo(tabela, selecao, filtro) {
  let out = [], de = 0;
  for (;;) {
    let q = db.from(tabela).select(selecao).order('id').range(de, de + 999);
    if (filtro) q = filtro(q);
    const { data, error } = await q;
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) return out;
    de += 1000;
  }
}
function waLink(tel, msg) {
  let d = telDigits(tel);
  if (!d) return null;
  if (!d.startsWith('55') || d.length <= 11) d = '55' + d.replace(/^55/, '');
  return `https://wa.me/${d}?text=${encodeURIComponent(msg)}`;
}

// ---------- Estado ----------
let familias = [];       // com membros e fichas pendentes
let busca = '';
let canalTV = null;
let timerTV = null;

async function carregarFamilias() {
  const [fams, fichas] = await Promise.all([
    tudo('familias', '*, membros_familia(*)'),
    tudo('fichas_compras', '*', q => q.eq('status', 'Pendente'))
  ]);
  const porFamilia = new Map();
  fichas.forEach(x => { const k = Number(x.familia_id); if (!porFamilia.has(k)) porFamilia.set(k, []); porFamilia.get(k).push(x); });
  familias = fams.map(f => {
    const pend = (porFamilia.get(Number(f.id)) || []).sort((a, b) => new Date(a.data_hora) - new Date(b.data_hora));
    return { ...f, membros: f.membros_familia || [], fichas: pend,
      total: Math.round(pend.reduce((s, x) => s + Number(x.valor_compra), 0) * 100) / 100 };
  }).sort((a, b) => norm(nomeF(a)).localeCompare(norm(nomeF(b))));
}

// ---------- Login ----------
function telaLogin() {
  return `<div class="p-5 max-w-md mx-auto mt-8"><div class="bg-white rounded-2xl shadow-lg p-6">
    <h1 class="text-3xl font-black mb-1">🥩 ${esc(NOME_ACOUGUE)}</h1>
    <p class="text-lg text-slate-600 mb-3">Entre para continuar.</p>
    <label class="block text-xl font-bold mt-3 mb-1">Usuário</label>
    <input id="lg_email" type="text" autocapitalize="none" autocorrect="off" autocomplete="username" class="w-full p-4 rounded-xl border-2 border-slate-400">
    <label class="block text-xl font-bold mt-3 mb-1">Senha</label>
    <input id="lg_senha" type="password" autocomplete="current-password" class="w-full p-4 rounded-xl border-2 border-slate-400"
      onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn bg-green-600 text-white w-full mt-5 text-2xl" onclick="entrar()">ENTRAR</button>
  </div></div>`;
}
async function entrar() {
  const usuario = $('#lg_email').value.trim().toLowerCase().replace(/\s+/g, ''), senha = $('#lg_senha').value;
  if (!usuario || !senha) return toast('Digite usuário e senha', false);
  const email = usuario.includes('@') ? usuario : usuario + '@frigorifico.app';
  const { error } = await db.auth.signInWithPassword({ email, password: senha });
  if (error) return toast('Usuário ou senha incorretos', false);
  render();
}
async function sair() { await db.auth.signOut(); render(); }

// ---------- Roteamento ----------
function rota() { return (location.hash || '#/').replace('#', ''); }
window.addEventListener('hashchange', render);
window.addEventListener('load', render);

async function render() {
  if (canalTV) { db.removeChannel(canalTV); canalTV = null; }
  clearInterval(timerTV);
  const r = rota();
  if (!configurado) { $('#app').innerHTML = telaConfig(); return; }
  const { data: { session } } = await db.auth.getSession();
  if (!session) { document.body.className = 'bg-slate-100 text-slate-900'; $('#app').innerHTML = telaLogin(); return; }
  try {
    if (r === '/tv') return await renderTV();
    await carregarFamilias();
    if (r === '/inadimplencia') renderInadimplencia();
    else if (r === '/acougueiros') await renderAcougueiros();
    else renderInicio();
  } catch (e) {
    $('#app').innerHTML = `<div class="p-6 max-w-xl mx-auto"><div class="bg-red-100 border-2 border-red-500 rounded-2xl p-6 text-xl">
      <p class="font-black text-2xl mb-2">⚠️ Erro ao conectar</p><p>${esc(e.message || e)}</p>
      <p class="mt-3 text-base">Confira a URL e a chave no topo do arquivo e se o <b>schema.sql</b> foi executado.</p>
      <button class="btn bg-slate-800 text-white mt-4" onclick="render()">Tentar de novo</button></div></div>`;
  }
}

function telaConfig() {
  return `<div class="p-6 max-w-xl mx-auto"><div class="bg-yellow-100 border-2 border-yellow-500 rounded-2xl p-6 text-lg">
    <p class="font-black text-2xl mb-2">🔧 Falta configurar</p>
    <ol class="list-decimal ml-6 space-y-1"><li>Crie um projeto grátis em supabase.com</li>
    <li>Rode o arquivo <b>schema.sql</b> no SQL Editor</li>
    <li>Abra o <b>index.html</b> num editor e preencha <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b></li></ol></div></div>`;
}

function navbar(ativo) {
  const item = (href, ic, txt, k) => `<a href="${href}" class="flex-1 text-center py-3 rounded-xl font-extrabold text-lg ${ativo === k ? 'bg-red-700 text-white' : 'bg-white text-slate-700 border-2 border-slate-300'}">${ic}<br class="sm:hidden"> ${txt}</a>`;
  return `<nav class="flex gap-2 p-2 sticky top-0 z-30 bg-slate-100">
    ${item('#/', '🔎', 'Clientes', 'inicio')}
    ${item('#/inadimplencia', '💰', 'Devedores', 'inad')}
    ${item('#/acougueiros', '🔪', 'Açougueiros', 'acoug')}
    ${item('#/tv', '📺', 'TV', 'tv')}</nav>`;
}

// ============================================================
// TELA 1 — Início
// ============================================================
function renderInicio() {
  $('#app').innerHTML = `
  ${navbar('inicio')}
  <header class="px-3 pb-2 max-w-5xl mx-auto">
    <div class="bg-red-800 text-white rounded-2xl p-4 mb-3 flex justify-between items-center"><h1 class="text-2xl font-black">🥩 ${esc(NOME_ACOUGUE)}</h1><button class="underline text-base" onclick="sair()">Sair</button></div>
    <input id="busca" type="search" value="${esc(busca)}" placeholder="Digite o nome do cliente ou da família..."
      class="w-full p-5 text-2xl rounded-2xl border-4 border-red-700 shadow-lg focus:outline-none focus:ring-4 focus:ring-red-300" autocomplete="off">
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button class="btn bg-green-600 text-white" onclick="modalNovaFamilia()">➕ Nova Família / Cliente</button>
      <button class="btn bg-blue-700 text-white" onclick="modalNovoPedido()">🛒 Novo Pedido Balcão</button>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-2">
      <button class="btn bg-slate-800 text-white" onclick="modalFinalizar()">🔒 Finalizar Expediente</button>
      <button class="btn bg-white border-2 border-slate-400 text-slate-800" onclick="seguro(modalDestinatarios)">📬 Destinatários</button>
    </div>
  </header>
  <main id="lista" class="px-3 pb-24 max-w-5xl mx-auto grid gap-3 md:grid-cols-2"></main>`;
  $('#busca').addEventListener('input', (e) => { busca = e.target.value; renderLista(); });
  renderLista();
}

function renderLista() {
  const q = norm(busca);
  const lista = familias.filter(f => !q || norm([f.nome_familia, f.cliente_principal, f.telefone_whatsapp, ...f.membros.map(m => m.nome_membro)].join(' ')).includes(q));
  $('#lista').innerHTML = lista.length ? lista.map(cardFamilia).join('') :
    `<p class="col-span-full text-center text-2xl text-slate-500 py-10">Nenhum cliente encontrado.<br>Use o botão verde para cadastrar.</p>`;
}

function cardFamilia(f) {
  const membros = f.membros.map(m => esc(m.nome_membro)).join(', ');
  return `<article class="bg-white rounded-2xl shadow-lg border-2 ${f.total > 0 ? 'border-red-400' : 'border-green-400'} p-4">
    <h2 class="text-3xl font-black leading-tight">${esc(nomeF(f))}</h2>
    ${f.cliente_principal && f.nome_familia ? `<p class="text-xl text-slate-700">👤 ${esc(f.cliente_principal)}</p>` : ''}
    ${f.telefone_whatsapp ? `<p class="text-xl text-slate-700">📞 ${esc(f.telefone_whatsapp)}</p>` : ''}
    ${membros ? `<p class="text-lg text-slate-500">👨‍👩‍👧 ${membros}</p>` : ''}
    ${f.pedido_habitual ? `<p class="text-lg bg-amber-50 border border-amber-300 rounded-lg p-2 mt-2">⭐ <b>Habitual:</b> ${esc(f.pedido_habitual)}</p>` : ''}
    <div class="mt-3 rounded-xl p-3 text-center ${f.total > 0 ? 'bg-red-600 text-white' : 'bg-green-100 text-green-800'}">
      <div class="text-base font-bold">${f.total > 0 ? 'TOTAL DEVIDO' : 'SEM DÍVIDA'}</div>
      <div class="text-4xl font-black">${brl(f.total)}</div>
      ${f.total > 0 ? `<div class="text-base font-bold mt-1">📅 ${esc(textoPrazo(f))}</div>` : ''}
    </div>
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button class="btn bg-orange-500 text-white" onclick="modalCompra(${f.id})">🧾 Registrar Compra</button>
      <button class="btn bg-green-600 text-white ${f.total <= 0 ? 'opacity-40' : ''}" onclick="modalPagamento(${f.id})">💵 Registrar Pagamento</button>
      <button class="btn bg-slate-700 text-white" onclick="imprimirExtrato(${f.id})">🖨️ Imprimir Extrato</button>
      <button class="btn bg-emerald-500 text-white" onclick="enviarZap(${f.id})">💬 WhatsApp</button>
    </div>
    <button class="w-full mt-2 text-slate-500 underline text-base py-2" onclick="modalDetalhes(${f.id})">Ver compras pendentes / histórico</button>
  </article>`;
}

// ---------- Modais ----------
function abrirModal(html) {
  $('#modal-root').innerHTML = `<div class="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)fecharModal()">
    <div class="bg-white w-full sm:max-w-lg max-h-[95vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl">${html}</div></div>`;
  semSugestoes();
}
// O navegador guarda tudo que é digitado e mostra uma lista enorme: desliga isso
function semSugestoes() {
  document.querySelectorAll('#modal-root input, #modal-root textarea').forEach(el => {
    if (el.type !== 'password') { el.setAttribute('autocomplete', 'off'); el.setAttribute('autocorrect', 'off'); el.name = 'x' + Math.random().toString(36).slice(2); }
  });
}
function fecharModal() { $('#modal-root').innerHTML = ''; }
const lbl = 'block text-xl font-bold mt-3 mb-1';
const inp = 'w-full p-4 rounded-xl border-2 border-slate-400 focus:border-red-600 focus:outline-none';
const cabModal = (t) => `<div class="flex justify-between items-center mb-2"><h3 class="text-2xl font-black">${t}</h3>
  <button class="text-4xl leading-none px-2" onclick="fecharModal()" aria-label="Fechar">✖</button></div>`;
const getF = (id) => familias.find(f => f.id === id);

function modalNovaFamilia() {
  abrirModal(`${cabModal('➕ Nova Família / Cliente')}
    <label class="${lbl}">Nome do cliente</label><input id="nf_resp" class="${inp}" placeholder="Ex: João Silva">
    <label class="${lbl}">Nome da família (se tiver)</label><input id="nf_nome" class="${inp}" placeholder="Ex: Família Silva">
    <p class="text-base text-slate-500 mt-1">Preencha pelo menos um dos dois.</p>
    <label class="${lbl}">WhatsApp (com DDD)</label><input id="nf_tel" type="tel" inputmode="tel" class="${inp}" placeholder="(75) 99999-9999">
    <label class="${lbl}">Pedido habitual</label><textarea id="nf_hab" rows="2" class="${inp}" placeholder="Ex: 1kg de acém moído + 500g de linguiça"></textarea>
    <label class="${lbl}">Outros membros (um por linha)</label><textarea id="nf_mem" rows="3" class="${inp}" placeholder="Pedro Silva (Filho)&#10;Maria Silva (Esposa)"></textarea>
    <button class="btn bg-green-600 text-white w-full mt-4 text-2xl" onclick="seguro(salvarFamilia)">✅ SALVAR</button>`);
}
async function salvarFamilia() {
  const nome = $('#nf_nome').value.trim(), resp = $('#nf_resp').value.trim();
  if (!nome && !resp) return toast('Preencha o nome do cliente ou da família', false);
  const { data, error } = await db.from('familias').insert({
    nome_familia: nome || null, cliente_principal: resp || null,
    telefone_whatsapp: $('#nf_tel').value.trim() || null, pedido_habitual: $('#nf_hab').value.trim() || null
  }).select().single();
  if (error) return toast('Erro: ' + error.message, false);
  const membros = $('#nf_mem').value.split('\n').map(s => s.trim()).filter(Boolean).map(n => ({ familia_id: data.id, nome_membro: n }));
  if (membros.length) await db.from('membros_familia').insert(membros);
  fecharModal(); toast('Família cadastrada!'); busca = ''; render();
}

function modalCompra(id) {
  const f = getF(id);
  abrirModal(`${cabModal('🧾 Registrar Compra (Fiado)')}
    <p class="text-xl font-bold text-red-700">${esc(nomeF(f))}</p>
    <label class="${lbl}">O que levou? (se quiser anotar)</label>
    <textarea id="rc_desc" rows="3" class="${inp}" placeholder="Ex: 2kg de acém, 1kg de linguiça"></textarea>
    ${f.pedido_habitual ? `<button class="btn bg-amber-100 border-2 border-amber-400 w-full mt-2 text-lg" onclick="$('#rc_desc').value=getF(${id}).pedido_habitual">⭐ Usar pedido habitual</button>` : ''}
    <label class="${lbl}">Valor (R$) *</label>
    <input id="rc_val" inputmode="decimal" class="${inp} text-3xl font-black" placeholder="0,00">
    <button class="btn bg-orange-500 text-white w-full mt-4 text-2xl" onclick="seguro(()=>salvarCompra(${id}))">✅ SALVAR COMPRA</button>`);
  setTimeout(() => $('#rc_desc').focus(), 100);
}
async function salvarCompra(id) {
  const desc = $('#rc_desc').value.trim(), val = parseValor($('#rc_val').value);
  if (isNaN(val) || val <= 0) return toast('Digite um valor válido', false);
  const { error } = await db.from('fichas_compras').insert({ familia_id: id, descricao_itens: desc || null, valor_compra: val, status: 'Pendente' });
  if (error) return toast('Erro: ' + error.message, false);
  fecharModal(); toast('Compra anotada na ficha!'); render();
}

function modalPagamento(id) {
  const f = getF(id);
  if (f.total <= 0) return toast('Esta família não tem dívida 🎉');
  abrirModal(`${cabModal('💵 Registrar Pagamento')}
    <p class="text-xl font-bold">${esc(nomeF(f))}</p>
    <div class="bg-red-100 rounded-xl p-3 text-center mt-2"><div class="font-bold">Deve</div><div class="text-4xl font-black text-red-700">${brl(f.total)}</div></div>
    <label class="${lbl}">Valor pago (R$) *</label>
    <input id="pg_val" inputmode="decimal" class="${inp} text-3xl font-black" value="${f.total.toFixed(2).replace('.', ',')}">
    <button class="btn bg-slate-200 w-full mt-2" onclick="$('#pg_val').value='${f.total.toFixed(2).replace('.', ',')}'">Pagar tudo</button>
    <label class="${lbl}">Forma de pagamento</label>
    <div class="grid grid-cols-3 gap-2" id="pg_forma">
      ${['Dinheiro', 'Pix', 'Cartão'].map((x, i) => `<button type="button" data-v="${x}" class="btn border-4 ${i === 0 ? 'border-green-600 bg-green-100' : 'border-slate-300 bg-white'}" onclick="escolherForma(this)">${x === 'Dinheiro' ? '💵' : x === 'Pix' ? '📱' : '💳'}<br>${x}</button>`).join('')}
    </div>
    <button class="btn bg-green-600 text-white w-full mt-4 text-2xl" onclick="seguro(()=>salvarPagamento(${id}))">✅ CONFIRMAR PAGAMENTO</button>`);
}
function escolherForma(btn) {
  document.querySelectorAll('#pg_forma button').forEach(b => { b.className = b.className.replace('border-green-600 bg-green-100', 'border-slate-300 bg-white'); });
  btn.className = btn.className.replace('border-slate-300 bg-white', 'border-green-600 bg-green-100');
}
async function salvarPagamento(id) {
  const f = getF(id);
  let val = parseValor($('#pg_val').value);
  if (isNaN(val) || val <= 0) return toast('Digite um valor válido', false);
  if (val > f.total + 0.001) return toast(`O valor passa do total devido (${brl(f.total)})`, false);
  const forma = document.querySelector('#pg_forma .border-green-600')?.dataset.v || 'Dinheiro';
  const { error } = await db.from('pagamentos_divida').insert({ familia_id: id, valor_pago: val, forma_pagamento: forma });
  if (error) return toast('Erro: ' + error.message, false);
  // Abate das fichas mais antigas primeiro. Se sobrar valor parcial, a ficha continua pendente com o restante.
  let resto = val;
  for (const fi of f.fichas) {
    if (resto <= 0.001) break;
    const v = Number(fi.valor_compra);
    if (resto >= v - 0.001) {
      await db.from('fichas_compras').update({ status: 'Pago' }).eq('id', fi.id);
      resto = Math.round((resto - v) * 100) / 100;
    } else {
      const novo = Math.round((v - resto) * 100) / 100;
      await db.from('fichas_compras').update({

}

// ---------- WhatsApp ----------
const p2 = (n) => String(n).padStart(2, '0');
const fmtDiaHora = (d) => { const x = new Date(d); return `${p2(x.getDate())}/${p2(x.getMonth() + 1)}, ${p2(x.getHours())}:${p2(x.getMinutes())}`; };
const DIA_MS = 86400000;
const fmtDia = (d) => new Date(d).toLocaleDateString('pt-BR');
// Vencimento = data da compra mais antiga em aberto + DIAS_PRAZO
function vencimento(f) {
  if (!f.fichas || !f.fichas.length) return null;
  const v = new Date(f.fichas[0].data_hora); v.setHours(0, 0, 0, 0);
  return new Date(v.getTime() + DIAS_PRAZO * DIA_MS);
}
function diasParaVencer(f) {            // negativo = atrasado
  const v = vencimento(f); if (!v) return null;
  const h = new Date(); h.setHours(0, 0, 0, 0);
  return Math.round((v - h) / DIA_MS);
}
const vencido = (f) => f.total > 0 && diasParaVencer(f) <= 0;
function textoPrazo(f) {
  const d = diasParaVencer(f);
  if (d === null) return '';
  if (d > 0) return `vence em ${fmtDia(vencimento(f))} (faltam ${d} dia${d > 1 ? 's' : ''})`;
  if (d === 0) return `vence HOJE (${fmtDia(vencimento(f))})`;
  return `venceu em ${fmtDia(vencimento(f))} (${-d} dia${d < -1 ? 's' : ''} de atraso)`;
}
function msgCobranca(f) {
  const linhas = f.fichas.map(x => `• ${fmtDiaHora(x.data_hora)} - ${x.descricao_itens ? x.descricao_itens + ' - ' : ''}${brl(x.valor_compra)}`).join('\n');
  const d = diasParaVencer(f);
  const prazo = d > 0 ? `📅 Vencimento: *${fmtDia(vencimento(f))}* (${DIAS_PRAZO} dias após a primeira compra)`
    : `📅 Venceu em: *${fmtDia(vencimento(f))}*${d < 0 ? ` (${-d} dia${d < -1 ? 's' : ''} de atraso)` : ' (hoje)'}`;
  return (`Olá, ${nomeCli(f)}! Aqui é do ${NOME_ACOUGUE}. ☺️\n\nSegue o histórico das suas compras na ficha (${f.fichas.length} compra${f.fichas.length > 1 ? 's' : ''}):\n${linhas}\n\n*TOTAL: ${brl(f.total)}*\n${prazo}\n\n` +
    `Estamos a disposição, acerte por:\n- Pix, no conforto da sua casa;\nou\n- Passe aqui e pague em cartão ou dinheiro.\n\nObrigado pela preferência!`).replace(/ /g, ' ');
}
function enviarZap(id) {

  if (!f.telefone_whatsapp) return toast('Cliente sem telefone cadastrado', false);
  const msg = f.total > 0 ? msgCobranca(f) : `Olá, ${nomeCli(f)}! Aqui é do ${NOME_ACOUGUE}. ☺️ Sua ficha está em dia. Obrigado pela preferência!`;

function telInternacional(t) {
  let d = telDigits(t);
  if (!d) return '';
  if (!d.startsWith('55') || d.length <= 11) d = '55' + d.replace(/^55/, '');
  return d;
}
function planilhaCobranca() {
  if (typeof XLSX === 'undefined') return toast('A biblioteca de planilha não carregou. Recarregue a página.', false);

  const linhas = [['Nome', 'Telefone', 'Mensagem', 'Valor', 'Vencimento', 'Dias de atraso'],
    ...lista.map(f => [nomeCli(f), telInternacional(f.telefone_whatsapp), msgCobranca(f).replace(/\u00a0/g, ' '), Math.round(f.total * 100) / 100, fmtDia(vencimento(f)), -diasParaVencer(f)])];
  const ws = XLSX.utils.aoa_to_sheet(linhas);
  ws['!cols'] = [{ wch: 24 }, { wch: 16 }, { wch: 80 }, { wch: 12 }, { wch: 12 }, { wch: 10 }];
  for (let r = 1; r < linhas.length; r++) { const c = ws[XLSX.utils.encode_cell({ r, c: 1 })]; if (c) { c.t = 's'; c.v = String(c.v); } }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Cobranca');
  XLSX.writeFile(wb, `cobranca-${dataLocal()}.xlsx`);

}

let relatorio = null;
const dataLocal = (d = new Date()) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const num2 = (n) => Math.round(Number(n || 0) * 100) / 100;

async function gerarRelatorio() {
  if (typeof XLSX === 'undefined') throw new Error('A biblioteca de planilha não carregou. Verifique a internet e recarregue a página.');
  toast('Gerando planilha...');
  await carregarFamilias();
  const hoje0 = new Date(); hoje0.setHours(0, 0, 0, 0);
  const ini = hoje0.toISOString();
  const [dest, pags, comprasHoje, pedidosHoje] = await Promise.all([
    tudo('destinatarios_relatorio', '*'),
    tudo('pagamentos_divida', '*'),
    tudo('fichas_compras', '*', q => q.gte('data_hora', ini)),
    tudo('pedidos_bancada', '*', q => q.gte('created_at', ini))
  ]);
  const nomes = new Map(familias.map(f => [Number(f.id), nomeF(f)]));
  const nomeDe = (id) => nomes.get(Number(id)) || '(cliente removido)';
  const soma = (arr, k) => num2(arr.reduce((s, x) => s + Number(x[k] || 0), 0));
  const pagsHoje = pags.filter(p => new Date(p.data_hora) >= hoje0);
  const clientes = [...familias].sort((a, b) => b.total - a.total || norm(nomeF(a)).localeCompare(norm(nomeF(b))));
  const devedores = clientes.filter(f => f.total > 0);
  const totalReceber = num2(devedores.reduce((s, f) => s + f.total, 0));
  const recebidoHoje = soma(pagsHoje, 'valor_pago');
  const compradoHoje = soma(comprasHoje, 'valor_compra');
  const dia = new Date().toLocaleDateString('pt-BR');
  const dh = (d) => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const hh = (d) => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  const wb = XLSX.utils.book_new();
  const aba = (nome, linhas, larguras, colsMoeda = []) => {
    const ws = XLSX.utils.aoa_to_sheet(linhas);
    ws['!cols'] = larguras.map(w => ({ wch: w }));
    colsMoeda.forEach(c => {
      for (let r = 1; r < linhas.length; r++) {
        const cel = ws[XLSX.utils.encode_cell({ r, c })];
        if (cel && typeof cel.v === 'number') cel.z = '"R$" #,##0.00';
      }
    });
    XLSX.utils.book_append_sheet(wb, ws, nome);
  };
  aba('Resumo', [
    [NOME_ACOUGUE], ['Fechamento do dia', dia], [],
    ['Total a receber (todas as fichas)', brl(totalReceber)],
    ['Clientes devendo', devedores.length],
    ['Recebido hoje', brl(recebidoHoje)],
    ['Compras anotadas na ficha hoje', brl(compradoHoje)],
    ['Pedidos no balcão hoje', pedidosHoje.length]
  ], [38, 24]);
  aba('Clientes', [['Cliente / Família', 'Responsável', 'Telefone', 'Membros', 'Pedido habitual', 'Total devido'],
    ...clientes.map(f => [nomeF(f), f.cliente_principal && f.nome_familia ? f.cliente_principal : '', f.telefone_whatsapp || '',
      f.membros.map(m => m.nome_membro).join(', '), f.pedido_habitual || '', num2(f.total)])], [28, 22, 18, 30, 30, 16], [5]);
  aba('Fichas pendentes', [['Cliente / Família', 'Data', 'Itens', 'Valor', 'Vencimento da ficha'],
    ...devedores.flatMap(f => f.fichas.map(x => [nomeF(f), dh(x.data_hora), x.descricao_itens || '', num2(x.valor_compra), fmtDia(vencimento(f))]))], [28, 18, 40, 14, 16], [3]);
  aba('Compras de hoje', [['Cliente / Família', 'Hora', 'Itens', 'Valor', 'Situação'],
    ...comprasHoje.map(x => [nomeDe(x.familia_id), hh(x.data_hora), x.descricao_itens || '', num2(x.valor_compra), x.status])], [28, 10, 40, 14, 12], [3]);
  aba('Pagamentos', [['Data', 'Cliente / Família', 'Forma', 'Valor'],
    ...[...pags].sort((a, b) => new Date(b.data_hora) - new Date(a.data_hora)).map(p => [dh(p.data_hora), nomeDe(p.familia_id), p.forma_pagamento, num2(p.valor_pago)])], [18, 28, 12, 14], [3]);
  aba('Pedidos de hoje', [['Hora', 'Cliente', 'Itens', 'Açougueiro', 'Situação'],
    ...pedidosHoje.map(p => [hh(p.created_at), p.cliente_nome, p.itens_pedido, p.acougueiro || '', p.status === 'Concluído' ? 'Entregue' : 'Na TV'])], [10, 24, 44, 18, 14]);

  const arquivo = `fechamento-${dataLocal()}.xlsx`;
  const base64 = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
  const bytes = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const texto = [
    `*${NOME_ACOUGUE}* - Fechamento de ${dia}`, '',
    `💰 Total a receber: ${brl(totalReceber)}`,
    `👥 Clientes devendo: ${devedores.length}`,
    `✅ Recebido hoje: ${brl(recebidoHoje)}`,
    `🧾 Compras na ficha hoje: ${brl(compradoHoje)}`,
    `🛒 Pedidos no balcão hoje: ${pedidosHoje.length}`
  ].join('\n').replace(/ /g, ' ');

  const emails = dest.filter(d => d.tipo === 'email');
  const zaps = dest.filter(d => d.tipo === 'whatsapp');
  let emailStatus = null;
  if (emails.length) {
    try {
      const { data, error } = await db.functions.invoke('enviar-relatorio', {
        body: { assunto: `Fechamento ${dia} - ${NOME_ACOUGUE}`, arquivo, base64,
          html: '<pre style="font-family:Arial,sans-serif;font-size:15px">' + esc(texto.replace(/\*/g, '')) + '</pre><p>Planilha completa em anexo.</p>' }
      });
      if (error) throw error;
      if (data && data.erro === 'sem_chave') emailStatus = { ok: false, msg: 'O envio automático de e-mail ainda não foi ativado (falta a chave do serviço de e-mail). Use os botões abaixo por enquanto.' };
      else if (data && data.erro) emailStatus = { ok: false, msg: 'Não consegui enviar o e-mail: ' + data.erro };
      else emailStatus = { ok: true, msg: `E-mail enviado para ${emails.length} endereço(s) com a planilha em anexo.` };
    } catch (e) {
      emailStatus = { ok: false, msg: 'Não consegui enviar o e-mail automaticamente. Use os botões abaixo.' };
    }
  }
  relatorio = { arquivo, blob, texto, emails, zaps, emailStatus, dia };
  mostrarRelatorio();
}

function mostrarRelatorio() {
  const r = relatorio;
  const arq = new File([r.blob], r.arquivo, { type: r.blob.type });
  const podeCompartilhar = !!(navigator.canShare && navigator.canShare({ files: [arq] }));
  const mailto = 'mailto:' + r.emails.map(e => encodeURIComponent(e.contato)).join(',') +
    '?subject=' + encodeURIComponent(`Fechamento ${r.dia} - ${NOME_ACOUGUE}`) + '&body=' + encodeURIComponent(r.texto.replace(/\*/g, '') + '\n\n(Anexe a planilha baixada.)');
  abrirModal(`${cabModal('✅ Expediente finalizado')}
    <p class="text-lg">Planilha pronta: <b>${esc(r.arquivo)}</b></p>
    ${r.emailStatus
      ? `<p class="mt-2 p-3 rounded-xl text-lg ${r.emailStatus.ok ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-900'}">📧 ${esc(r.emailStatus.msg)}</p>`
      : '<p class="mt-2 text-slate-500">Nenhum e-mail cadastrado (botão 📬 Destinatários).</p>'}
    <button class="btn bg-blue-700 text-white w-full mt-3" onclick="baixarPlanilha()">⬇️ Baixar planilha</button>
    ${podeCompartilhar ? '<button class="btn bg-indigo-600 text-white w-full mt-2" onclick="compartilharPlanilha()">📤 Compartilhar planilha (WhatsApp, e-mail...)</button>' : ''}
    ${r.zaps.map((z, i) => `<button class="btn bg-emerald-600 text-white w-full mt-2" onclick="enviarResumoZap(${i})">💬 Resumo no WhatsApp: ${esc(z.nome || z.contato)}</button>`).join('')}
    ${r.zaps.length ? '<p class="text-sm text-slate-500 mt-1">O WhatsApp não permite enviar arquivo sozinho: o resumo abre pronto para enviar, e a planilha você anexa pelo botão Compartilhar (ou baixando e anexando).</p>'
      : '<p class="text-sm text-slate-500 mt-2">Nenhum WhatsApp cadastrado (botão 📬 Destinatários).</p>'}
    ${r.emails.length && !(r.emailStatus && r.emailStatus.ok) ? `<a class="btn bg-white border-2 border-slate-400 text-slate-800 w-full mt-2 flex items-center justify-center" href="${esc(mailto)}">✉️ Abrir e-mail com o resumo</a>` : ''}
    <button class="btn bg-slate-200 w-full mt-3" onclick="fecharModal()">Fechar</button>`);
}
function baixarPlanilha() {
  const url = URL.createObjectURL(relatorio.blob);
  const a = document.createElement('a');
  a.href = url; a.download = relatorio.arquivo;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function compartilharPlanilha() {
  const r = relatorio;
  try { await navigator.share({ files: [new File([r.blob], r.arquivo, { type: r.blob.type })], title: r.arquivo, text: r.texto }); }
  catch (e) { if (e.name !== 'AbortError') toast('Não foi possível compartilhar. Use "Baixar planilha".', false); }
}
function enviarResumoZap(i) {
  window.open(waLink(relatorio.zaps[i].contato, relatorio.texto), '_blank');
}

async function modalDestinatarios() {
  const dest = await tudo('destinatarios_relatorio', '*');
  abrirModal(`${cabModal('📬 Destinatários do relatório')}
    <p class="text-lg text-slate-600">Quem recebe o fechamento do dia.</p>
    <div class="mt-2">${dest.length ? dest.map(d => `
      <div class="flex items-center justify-between gap-2 border-b-2 py-2">
        <div class="min-w-0"><div class="font-bold text-lg">${d.tipo === 'email' ? '📧' : '💬'} ${esc(d.nome || (d.tipo === 'email' ? 'E-mail' : 'WhatsApp'))}</div>
        <div class="text-slate-600 break-all">${esc(d.contato)}</div></div>
        <button class="btn bg-red-600 text-white" style="min-height:44px" onclick="removerDest(${d.id})">🗑️</button>
      </div>`).join('') : '<p class="text-slate-500 py-3">Nenhum cadastrado ainda.</p>'}</div>
    <h4 class="text-xl font-black mt-4">➕ Adicionar</h4>
    <label class="${lbl}">Tipo</label>
    <select id="ds_tipo" class="${inp}"><option value="whatsapp">WhatsApp</option><option value="email">E-mail</option></select>
    <label class="${lbl}">Nome (opcional)</label><input id="ds_nome" class="${inp}" placeholder="Ex: Dono">
    <label class="${lbl}">Número com DDD ou e-mail</label><input id="ds_contato" class="${inp}" placeholder="(75) 99999-9999 ou dono@gmail.com">
    <button class="btn bg-green-600 text-white w-full mt-4 text-2xl" onclick="seguro(salvarDest)">✅ ADICIONAR</button>
    <button class="btn bg-slate-200 w-full mt-2" onclick="fecharModal()">Fechar</button>`);
}
async function salvarDest() {
  const tipo = $('#ds_tipo').value, nome = $('#ds_nome').value.trim();
  let contato = $('#ds_contato').value.trim();
  if (tipo === 'email') {
    contato = contato.toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contato)) return toast('E-mail inválido', false);
  } else {
    contato = telDigits(contato);
    if (contato.length < 10) return toast('Número inválido (coloque o DDD)', false);
  }
  const { error } = await db.from('destinatarios_relatorio').insert({ tipo, nome: nome || null, contato });
  if (error) return toast('Erro: ' + error.message, false);
  toast('Cadastrado!');
  await modalDestinatarios();
}
async function removerDest(id) {
  if (!confirm('Remover este destinatário?')) return;
  const { error } = await db.from('destinatarios_relatorio').delete().eq('id', id);
  if (error) return toast('Erro: ' + error.message, false);
  await modalDestinatarios();
}

let filaCobranca = [];
function cobrancaEmMassa() {
  filaCobranca = familias.filter(f => vencido(f) && f.telefone_whatsapp).sort((a, b) => b.total - a.total);
  if (!filaCobranca.length) return toast('Nenhum devedor vencido com telefone', false);
  proximaCobranca();
}
function proximaCobranca() {
  const f = filaCobranca.shift();
  if (!f) { fecharModal(); return toast('Cobranças enviadas!'); }
  abrirModal(`${cabModal('💬 Cobrança em massa')}
    <p class="text-xl">Próximo: <b>${esc(nomeF(f))}</b> — <span class="text-red-700 font-black">${brl(f.total)}</span></p>
    <p class="text-slate-500 mb-3">Restam ${filaCobranca.length} depois deste.</p>
    <button class="btn bg-emerald-600 text-white w-full text-xl" onclick="window.open(waLink(getF(${f.id}).telefone_whatsapp, msgCobranca(getF(${f.id}))),'_blank');proximaCobranca()">💬 Abrir WhatsApp e ir para o próximo</button>
    <button class="btn bg-slate-200 w-full mt-2" onclick="proximaCobranca()">Pular</button>`);
}

// ============================================================
// TELA 2 — Painel TV (#/tv)
// ============================================================
let pedidosTV = [];
let idsConhecidos = new Set();

async function renderTV() {
  document.body.className = 'bg-slate-950 text-white';
  $('#app').innerHTML = `
    <div class="min-h-screen p-4">
      <header class="flex justify-between items-center mb-4">
        <h1 class="text-5xl font-black text-yellow-400">🥩 PEDIDOS</h1>
        <div class="flex items-center gap-4"><span id="tv-hora" class="text-5xl font-black"></span>
        <a href="#/" class="btn bg-slate-700 text-white text-lg">⬅ Sair</a></div>
      </header>
      <div id="tv-grid" class="grid gap-4 grid-cols-1 md:grid-cols-2 xl:grid-cols-3"></div>
    </div>`;
  await carregarTV(true);
  const relogio = () => { const el = $('#tv-hora'); if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); drawTV(); };
  relogio();
  timerTV = setInterval(relogio, 30000);
  canalTV = db.channel('pedidos-tv').on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_bancada' }, () => carregarTV(false)).subscribe();
  // Reserva: caso o realtime caia, atualiza a cada 60s
  const reserva = setInterval(() => { if (rota() !== '/tv') return clearInterval(reserva); carregarTV(false); }, 60000);
}

async function carregarTV(primeira) {
  const desde = new Date(Date.now() - 12 * 3600 * 1000).toISOString();
  const { data, error } = await db.from('pedidos_bancada').select('*').gte('created_at', desde).order('created_at');
  if (error) return;
  const novos = data.filter(p => !idsConhecidos.has(p.id));
  pedidosTV = data;
  novos.forEach(p => idsConhecidos.add(p.id));
  if (!primeira && novos.some(p => p.status === 'Pendente')) bipe();
  drawTV(new Set(novos.map(p => p.id)), primeira);
}
function bipe() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); o.frequency.value = 880; o.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, 400); } catch (e) {}
}
function drawTV(novosIds = new Set(), primeira = false) {
  const grid = $('#tv-grid'); if (!grid) return;
  const fila = pedidosTV.filter(p => p.status !== 'Concluído');
  grid.innerHTML = fila.map(p => `
    <div class="bg-slate-800 rounded-3xl border-4 border-yellow-400 p-4 ${novosIds.has(p.id) && !primeira ? 'novo' : ''}">
      <div class="flex justify-between items-baseline gap-2"><span class="text-4xl font-black">${esc(p.cliente_nome)}</span><span class="text-2xl text-slate-400">${fmtHora(p.created_at)}</span></div>
      ${p.acougueiro ? `<p class="text-2xl font-bold text-yellow-300 mt-1">🔪 ${esc(p.acougueiro)}</p>` : ''}
      <p class="text-3xl mt-2 whitespace-pre-line leading-snug">${esc(p.itens_pedido)}</p>
      <button class="btn w-full mt-3 text-3xl bg-green-600 text-white" onclick="darBaixa(${p.id})">✔ Entregue (dar baixa)</button>
    </div>`).join('') || '<p class="col-span-full text-4xl text-slate-600 text-center py-20">Nenhum pedido no momento</p>';
}
async function darBaixa(id) {
  pedidosTV = pedidosTV.filter(x => x.id !== id); drawTV();
  const { error } = await db.from('pedidos_bancada').update({ status: 'Concluído' }).eq('id', id);
  if (error) { toast('Erro: ' + error.message, false); carregarTV(false); }
}

// Restaura o fundo claro ao sair da TV
window.addEventListener('hashchange', () => { if (rota() !== '/tv') document.body.className = 'bg-slate-100 text-slate-900'; });
</script>
